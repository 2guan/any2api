services:
  any2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: any2api:latest
    container_name: any2api
    restart: unless-stopped
    ports:
      - "3300:8788"      # 外部访问端口 3300 映射至容器内 8788
    environment:
      - NODE_ENV=production
      - ANY2API_HOST=0.0.0.0
      - ANY2API_PORT=8788
      - ANY2API_DATA_DIR=/app/data
      - ANY2API_OWNER_USERNAME=admin
      - ANY2API_OWNER_PASSWORD=admin123
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8788/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
